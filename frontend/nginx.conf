# Link-preview crawlers don't run JavaScript, so they get a small page with
# Open Graph tags from the backend instead of the SPA (PreviewController).
map $http_user_agent $link_preview_bot {
    default 0;
    ~*(discordbot|slackbot|slack-imgproxy|twitterbot|facebookexternalhit|facebot|linkedinbot|telegrambot|whatsapp|skypeuripreview|mastodon|redditbot|embedly|pinterest|applebot|googlebot|bingbot|signal) 1;
}

server {
    listen 80;
    root /usr/share/nginx/html;

    # Docker's DNS, resolved per request: nginx also starts while the backend is down.
    resolver 127.0.0.11 valid=30s;
    set $preview_backend http://wiki-backend:8080;

    # SPA: unknown paths fall back to the app.
    location / {
        if ($link_preview_bot) {
            rewrite ^(.*)$ /api/preview$1 break;
            proxy_pass $preview_backend;
        }
        try_files $uri $uri/ /index.html;
    }

    # Crawlers ask for it too; it's a file, not a page to preview.
    location = /favicon.ico {
    }

    # Must never be cached, so a new deploy is picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Vite puts a content hash in every asset filename.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
