spring.application.name=wiki

# Local dev: file-based H2 in PostgreSQL mode, so no Docker or database install is
# needed (see teaz_pro/docs/TECH_STACK.md). Prod uses Postgres from compose.yml.
spring.datasource.url=jdbc:h2:file:./data/wiki-dev;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
# Schema comes from Flyway (db/migration), never from Hibernate.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Errors as RFC 9457 problem details, so the UI can show their "detail".
spring.mvc.problemdetails.enabled=true

# Images in pages and wiki logos (FileService checks the type and size itself).
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# Uploaded images. Prod: a Docker volume, see compose.yml.
wiki.storage-dir=./data/files
# Public URL of the app, for links in link previews (PreviewController).
wiki.public-url=http://localhost:5173

# User search for sharing (Keycloak Admin API, client credentials). Unset secret =
# MockUserDirectory with a few fixed users (local dev), like the frontend's mock auth.
wiki.keycloak.url=https://auth.teaz.pro
wiki.keycloak.realm=teazpro
wiki.keycloak.admin-client-id=${WIKI_KEYCLOAK_ADMIN_CLIENT_ID:wiki-admin}
wiki.keycloak.admin-client-secret=${WIKI_KEYCLOAK_ADMIN_CLIENT_SECRET:}

# MCP server (pro.teaz.wiki.mcp): read-only search for AI assistants. Under
# /api so Traefik/nginx route it to this app like the rest of the API (see
# README, "AI access"); SecurityConfig (prod) requires the "wiki:read" scope.
spring.ai.mcp.server.name=teaz-wiki
spring.ai.mcp.server.instructions=Read-only search over Teaz Wiki. list_wikis, then search_wiki and get_page. \
  There is no tool to create, edit or delete anything.
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.streamable-http.mcp-endpoint=/api/mcp
