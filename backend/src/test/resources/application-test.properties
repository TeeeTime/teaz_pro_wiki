# Tests: in-memory database, mock user directory, temp storage. Combined with "prod"
# in SecurityConfigTests to test the real security rules without Postgres.
spring.datasource.url=jdbc:h2:mem:wiki-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
wiki.storage-dir=${java.io.tmpdir}/wiki-test-files
wiki.keycloak.admin-client-secret=
